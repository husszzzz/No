<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تثبيت التطبيق | Hassany VIP</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --primary-red: #e50914; --dark-bg: #0a0a0a; --glass-bg: rgba(20, 20, 20, 0.75); --glass-border: rgba(229, 9, 20, 0.3); --text-glow: 0 0 10px rgba(229, 9, 20, 0.5); }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--dark-bg); color: #fff; overflow: hidden; height: 100vh; display: flex; justify-content: center; align-items: center; }
        #particles-js { position: absolute; width: 100%; height: 100%; z-index: 1; }
        .glass-card { position: relative; z-index: 10; background: var(--glass-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid var(--glass-border); border-radius: 30px; padding: 40px 30px; width: 90%; max-width: 420px; text-align: center; box-shadow: 0 25px 50px rgba(0,0,0,0.8), inset 0 0 20px rgba(229, 9, 20, 0.1); animation: cardFloat 3s ease-in-out infinite alternate; }
        @keyframes cardFloat { 0% { transform: translateY(0px); } 100% { transform: translateY(-10px); } }
        .app-icon-container { position: relative; width: 110px; height: 110px; margin: 0 auto 25px; }
        .app-icon { width: 100%; height: 100%; border-radius: 25px; object-fit: cover; box-shadow: 0 15px 35px rgba(229, 9, 20, 0.4); border: 2px solid var(--primary-red); z-index: 2; position: relative; }
        .icon-glow { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 100%; height: 100%; background: var(--primary-red); filter: blur(30px); opacity: 0.6; z-index: 1; animation: pulseGlow 2s infinite; }
        @keyframes pulseGlow { 0% { transform: translate(-50%, -50%) scale(1); opacity: 0.4; } 50% { transform: translate(-50%, -50%) scale(1.3); opacity: 0.7; } 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.4; } }
        h1 { font-size: 26px; font-weight: 900; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; text-shadow: var(--text-glow); }
        .subtitle { color: #aaa; font-size: 14px; margin-bottom: 30px; }
        .info-box { background: rgba(0,0,0,0.4); border-radius: 15px; padding: 15px; margin-bottom: 30px; border: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-around; }
        .info-item { display: flex; flex-direction: column; }
        .info-label { font-size: 11px; color: #777; text-transform: uppercase; }
        .info-value { font-size: 14px; font-weight: 700; color: #fff; }
        .install-btn { display: inline-block; width: 100%; padding: 16px; background: linear-gradient(45deg, #990000, var(--primary-red)); color: #fff; font-size: 18px; font-weight: 900; border: none; border-radius: 16px; cursor: pointer; text-decoration: none; transition: all 0.3s; box-shadow: 0 10px 20px rgba(229, 9, 20, 0.4); position: relative; overflow: hidden; }
        .install-btn::before { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent); transition: 0.5s; }
        .install-btn:active { transform: scale(0.95); }
        .install-btn:hover::before { left: 100%; }
        .footer { margin-top: 25px; font-size: 12px; color: #555; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; }
    </style>
</head>
<body>
    <canvas id="particles-js"></canvas>
    <div class="glass-card">
        <div class="app-icon-container">
            <div class="icon-glow"></div>
            <img src="https://cdn.icon-icons.com/icons2/3142/PNG/512/apple_app_store_macos_bigsur_icon_192461.png" class="app-icon" alt="App Icon">
        </div>
        <h1>8 Ball Pool</h1>
        <p class="subtitle">تم توقيع التطبيق بنجاح وهو جاهز للتثبيت</p>
        <div class="info-box">
            <div class="info-item"><span class="info-label">الإصدار</span><span class="info-value">56.26.1</span></div>
            <div class="info-item"><span class="info-label">المطور</span><span class="info-value">Hassany VIP</span></div>
            <div class="info-item"><span class="info-label">الحالة</span><span class="info-value" style="color:#00ff88;">مُوَقَّع ✅</span></div>
        </div>
        <a href="#" id="installLink" class="install-btn">تثبيت التطبيق الآن</a>
        <div class="footer">POWERED BY HASSANY STORE</div>
    </div>
    <script>
        const currentUrl = window.location.href.replace('index.html', '');
        const manifestUrl = currentUrl + 'manifest.plist';
        document.getElementById('installLink').href = 'itms-services://?action=download-manifest&url=' + manifestUrl;
        document.getElementById('installLink').addEventListener('click', function() { this.innerHTML = 'جاري التثبيت... ⏳'; this.style.background = '#333'; this.style.boxShadow = 'none'; });
        const canvas = document.getElementById('particles-js');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        const particles = [];
        class Particle {
            constructor() { this.x = Math.random() * canvas.width; this.y = Math.random() * canvas.height; this.size = Math.random() * 2; this.speedY = Math.random() * 1 + 0.5; this.color = Math.random() > 0.5 ? '#e50914' : '#555'; }
            update() { this.y -= this.speedY; if (this.y < 0) { this.y = canvas.height; this.x = Math.random() * canvas.width; } }
            draw() { ctx.fillStyle = this.color; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill(); }
        }
        for(let i=0; i<100; i++) particles.push(new Particle());
        function animate() { ctx.clearRect(0, 0, canvas.width, canvas.height); particles.forEach(p => { p.update(); p.draw(); }); requestAnimationFrame(animate); }
        animate();
        window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });
    </script>
</body>
</html>
