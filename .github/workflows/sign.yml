name: ZSign Worker
on:
  workflow_dispatch:
    inputs:
      p12_path:
        required: true
      prov_path:
        required: true
      password:
        required: true
      chat_id:
        required: true

permissions:
  contents: write

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup zsign (Old Stable Version)
        run: |
          sudo apt-get update
          sudo apt-get install -y zip unzip curl libssl-dev cmake make g++
          git clone https://github.com/zhlynn/zsign.git
          cd zsign
          git checkout $(git rev-list -n 1 --before="2023-10-01" master)
          cmake .
          make
          sudo cp zsign /usr/local/bin/
          sudo chmod +x /usr/local/bin/zsign

      - name: Download Files
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          P12_PATH: ${{ github.event.inputs.p12_path }}
          PROV_PATH: ${{ github.event.inputs.prov_path }}
          GAME_URL: "https://github.com/husszzzz/8ball-pool/releases/download/1.5/8.Ball.Pool_56.26.1_1787089904.ipa"
        run: |
          curl -s -L "https://api.telegram.org/file/bot${BOT_TOKEN}/${P12_PATH}" -o cert.p12
          curl -s -L "https://api.telegram.org/file/bot${BOT_TOKEN}/${PROV_PATH}" -o cert.mobileprovision
          curl -s -L "$GAME_URL" -o game.ipa

      - name: Sign IPA
        env:
          PASSWORD: ${{ github.event.inputs.password }}
        run: |
          zsign -k cert.p12 -p "$PASSWORD" -m cert.mobileprovision -o signed.ipa game.ipa

      - name: Upload to GitHub Releases
        id: upload_ipa
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          UNIQUE_ID="${{ github.event.inputs.chat_id }}_$(date +%s)"
          echo "UNIQUE_ID=${UNIQUE_ID}" >> $GITHUB_ENV
          TAG="ota-${UNIQUE_ID}"
          gh release create "$TAG" signed.ipa --title "Signed App" --notes "Signed via Hassany Bot"
          echo "IPA_URL=https://github.com/${{ github.repository }}/releases/download/${TAG}/signed.ipa" >> $GITHUB_ENV

      - name: Generate VIP OTA Page and Push to Vercel
        env:
          CHAT_ID: ${{ github.event.inputs.chat_id }}
          VERCEL_DOMAIN: "no-nine-ebon.vercel.app"
        run: |
          mkdir -p install_${UNIQUE_ID}
          
          # إنشاء ملف Plist
          cat <<EOF > install_${UNIQUE_ID}/manifest.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>items</key>
            <array>
              <dict>
                <key>assets</key>
                <array>
                  <dict>
                    <key>kind</key>
                    <string>software-package</string>
                    <key>url</key>
                    <string>${{ env.IPA_URL }}</string>
                  </dict>
                </array>
                <key>metadata</key>
                <dict>
                  <key>bundle-identifier</key>
                  <string>com.miniclip.8ballpoolmult</string>
                  <key>bundle-version</key>
                  <string>56.26.1</string>
                  <key>kind</key>
                  <string>software</string>
                  <key>title</key>
                  <string>8 Ball Pool - Hassany VIP</string>
                </dict>
              </dict>
            </array>
          </dict>
          </plist>
          EOF
          
          # إنشاء تصميم الواجهة الاحترافي (VIP Red & Black)
          cat << 'EOF_HTML' > install_${UNIQUE_ID}/index.html
          <!DOCTYPE html>
          <html lang="ar" dir="rtl">
          <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
              <title>تثبيت التطبيق | Hassany VIP</title>
              <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
              <style>
                  :root {
                      --primary-red: #e50914;
                      --dark-bg: #0a0a0a;
                      --glass-bg: rgba(20, 20, 20, 0.75);
                      --glass-border: rgba(229, 9, 20, 0.3);
                      --text-glow: 0 0 10px rgba(229, 9, 20, 0.5);
                  }
                  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
                  body { background-color: var(--dark-bg); color: #fff; overflow: hidden; height: 100vh; display: flex; justify-content: center; align-items: center; }
                  
                  #particles-js { position: absolute; width: 100%; height: 100%; z-index: 1; }
                  
                  .glass-card {
                      position: relative;
                      z-index: 10;
                      background: var(--glass-bg);
                      backdrop-filter: blur(20px);
                      -webkit-backdrop-filter: blur(20px);
                      border: 1px solid var(--glass-border);
                      border-radius: 30px;
                      padding: 40px 30px;
                      width: 90%;
                      max-width: 420px;
                      text-align: center;
                      box-shadow: 0 25px 50px rgba(0,0,0,0.8), inset 0 0 20px rgba(229, 9, 20, 0.1);
                      animation: cardFloat 3s ease-in-out infinite alternate;
                  }
                  
                  @keyframes cardFloat {
                      0% { transform: translateY(0px); }
                      100% { transform: translateY(-10px); }
                  }
                  
                  .app-icon-container { position: relative; width: 110px; height: 110px; margin: 0 auto 25px; }
                  .app-icon { width: 100%; height: 100%; border-radius: 25px; object-fit: cover; box-shadow: 0 15px 35px rgba(229, 9, 20, 0.4); border: 2px solid var(--primary-red); z-index: 2; position: relative; }
                  .icon-glow { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 100%; height: 100%; background: var(--primary-red); filter: blur(30px); opacity: 0.6; z-index: 1; animation: pulseGlow 2s infinite; }
                  
                  @keyframes pulseGlow {
                      0% { transform: translate(-50%, -50%) scale(1); opacity: 0.4; }
                      50% { transform: translate(-50%, -50%) scale(1.3); opacity: 0.7; }
                      100% { transform: translate(-50%, -50%) scale(1); opacity: 0.4; }
                  }
                  
                  h1 { font-size: 26px; font-weight: 900; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; text-shadow: var(--text-glow); }
                  .subtitle { color: #aaa; font-size: 14px; margin-bottom: 30px; }
                  
                  .info-box { background: rgba(0,0,0,0.4); border-radius: 15px; padding: 15px; margin-bottom: 30px; border: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-around; }
                  .info-item { display: flex; flex-direction: column; }
                  .info-label { font-size: 11px; color: #777; text-transform: uppercase; }
                  .info-value { font-size: 14px; font-weight: 700; color: #fff; }
                  
                  .install-btn {
                      display: inline-block;
                      width: 100%;
                      padding: 16px;
                      background: linear-gradient(45deg, #990000, var(--primary-red));
                      color: #fff;
                      font-size: 18px;
                      font-weight: 900;
                      border: none;
                      border-radius: 16px;
                      cursor: pointer;
                      text-decoration: none;
                      transition: all 0.3s;
                      box-shadow: 0 10px 20px rgba(229, 9, 20, 0.4);
                      position: relative;
                      overflow: hidden;
                  }
                  .install-btn::before {
                      content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent); transition: 0.5s;
                  }
                  .install-btn:active { transform: scale(0.95); }
                  .install-btn:hover::before { left: 100%; }
                  
                  .footer { margin-top: 25px; font-size: 12px; color: #555; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; }
              </style>
          </head>
          <body>
              <canvas id="particles-js"></canvas>
              <div class="glass-card">
                  <div class="app-icon-container">
                      <div class="icon-glow"></div>
                      <img src="https://cdn.icon-icons.com/icons2/3142/PNG/512/apple_app_store_macos_bigsur_icon_192461.png" class="app-icon" alt="App Icon">
                  </div>
                  <h1>8 Ball Pool</h1>
                  <p class="subtitle">تم توقيع التطبيق بنجاح وهو جاهز للتثبيت</p>
                  
                  <div class="info-box">
                      <div class="info-item">
                          <span class="info-label">الإصدار</span>
                          <span class="info-value">56.26.1</span>
                      </div>
                      <div class="info-item">
                          <span class="info-label">المطور</span>
                          <span class="info-value">Hassany VIP</span>
                      </div>
                      <div class="info-item">
                          <span class="info-label">الحالة</span>
                          <span class="info-value" style="color:#00ff88;">مُوَقَّع ✅</span>
                      </div>
                  </div>
                  
                  <a href="#" id="installLink" class="install-btn">تثبيت التطبيق الآن</a>
                  <div class="footer">POWERED BY HASSANY STORE</div>
              </div>
          
              <script>
                  // تهيئة الرابط الديناميكي للتثبيت
                  const currentUrl = window.location.href.replace('index.html', '');
                  const manifestUrl = currentUrl + 'manifest.plist';
                  document.getElementById('installLink').href = 'itms-services://?action=download-manifest&url=' + manifestUrl;
                  
                  document.getElementById('installLink').addEventListener('click', function() {
                      this.innerHTML = 'جاري التثبيت... ⏳';
                      this.style.background = '#333';
                      this.style.boxShadow = 'none';
                  });
          
                  // نظام جزيئات الخلفية (Particles System)
                  const canvas = document.getElementById('particles-js');
                  const ctx = canvas.getContext('2d');
                  canvas.width = window.innerWidth;
                  canvas.height = window.innerHeight;
                  const particles = [];
                  class Particle {
                      constructor() {
                          this.x = Math.random() * canvas.width;
                          this.y = Math.random() * canvas.height;
                          this.size = Math.random() * 2;
                          this.speedY = Math.random() * 1 + 0.5;
                          this.color = Math.random() > 0.5 ? '#e50914' : '#555';
                      }
                      update() {
                          this.y -= this.speedY;
                          if (this.y < 0) { this.y = canvas.height; this.x = Math.random() * canvas.width; }
                      }
                      draw() {
                          ctx.fillStyle = this.color;
                          ctx.beginPath();
                          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                          ctx.fill();
                      }
                  }
                  for(let i=0; i<100; i++) particles.push(new Particle());
                  function animate() {
                      ctx.clearRect(0, 0, canvas.width, canvas.height);
                      particles.forEach(p => { p.update(); p.draw(); });
                      requestAnimationFrame(animate);
                  }
                  animate();
                  window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });
              </script>
          </body>
          </html>
          EOF_HTML

          # حفظ الملفات بالمستودع حتى يقرأها Vercel
          git config --global user.name "Hassany Bot"
          git config --global user.email "bot@hassany.com"
          git checkout main || git checkout master
          git add install_${UNIQUE_ID}/
          git commit -m "Deploy VIP OTA for ${UNIQUE_ID}"
          git push origin HEAD

          INSTALL_URL="https://${VERCEL_DOMAIN}/install_${UNIQUE_ID}/index.html"
          echo "INSTALL_URL=${INSTALL_URL}" >> $GITHUB_ENV

      - name: Send Telegram Message
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ github.event.inputs.chat_id }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\": \"${CHAT_ID}\", \"text\": \"✅ اكتمل التوقيع الاحترافي بنجاح!\n\n🌐 رابط التثبيت المباشر (يتغير تلقائياً):\n${INSTALL_URL}\", \"disable_web_page_preview\": true}"
