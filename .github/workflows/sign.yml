name: ZSign Worker
on:
  workflow_dispatch:
    inputs:
      p12_path:
        required: true
      prov_path:
        required: true
      password:
        required: true
      chat_id:
        required: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  sign:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup zsign (Old Stable Version)
        run: |
          sudo apt-get update
          sudo apt-get install -y zip unzip curl libssl-dev cmake make g++
          git clone https://github.com/zhlynn/zsign.git
          cd zsign
          git checkout $(git rev-list -n 1 --before="2023-10-01" master)
          cmake .
          make
          sudo cp zsign /usr/local/bin/
          sudo chmod +x /usr/local/bin/zsign

      - name: Download Files
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          P12_PATH: ${{ github.event.inputs.p12_path }}
          PROV_PATH: ${{ github.event.inputs.prov_path }}
          GAME_URL: "https://github.com/husszzzz/8ball-pool/releases/download/1.5/8.Ball.Pool_56.26.1_1787089904.ipa"
        run: |
          curl -s -L "https://api.telegram.org/file/bot${BOT_TOKEN}/${P12_PATH}" -o cert.p12
          curl -s -L "https://api.telegram.org/file/bot${BOT_TOKEN}/${PROV_PATH}" -o cert.mobileprovision
          curl -s -L "$GAME_URL" -o game.ipa

      - name: Sign IPA
        env:
          PASSWORD: ${{ github.event.inputs.password }}
        run: |
          zsign -k cert.p12 -p "$PASSWORD" -m cert.mobileprovision -o signed.ipa game.ipa

      - name: Upload to GitHub Releases
        id: upload_ipa
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="ota-${{ github.event.inputs.chat_id }}-$(date +%s)"
          gh release create "$TAG" signed.ipa --title "Signed App" --notes "Signed via Hassany Bot"
          echo "IPA_URL=https://github.com/${{ github.repository }}/releases/download/${TAG}/signed.ipa" >> $GITHUB_ENV

      - name: Generate OTA HTML and Plist
        env:
          CHAT_ID: ${{ github.event.inputs.chat_id }}
        run: |
          mkdir -p public/install_$CHAT_ID
          
          cat <<EOF > public/install_$CHAT_ID/manifest.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>items</key>
            <array>
              <dict>
                <key>assets</key>
                <array>
                  <dict>
                    <key>kind</key>
                    <string>software-package</string>
                    <key>url</key>
                    <string>${{ env.IPA_URL }}</string>
                  </dict>
                </array>
                <key>metadata</key>
                <dict>
                  <key>bundle-identifier</key>
                  <string>com.miniclip.8ballpoolmult</string>
                  <key>bundle-version</key>
                  <string>56.26.1</string>
                  <key>kind</key>
                  <string>software</string>
                  <key>title</key>
                  <string>8 Ball Pool</string>
                </dict>
              </dict>
            </array>
          </dict>
          </plist>
          EOF
          
          cat <<EOF > public/install_$CHAT_ID/index.html
          <!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>تثبيت اللعبة</title></head><body style="text-align: center; font-family: sans-serif; margin-top: 50px;"><h2>تم التوقيع بنجاح 🚀</h2><a href="itms-services://?action=download-manifest&url=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/install_$CHAT_ID/manifest.plist" style="display:inline-block; padding: 15px 30px; background: #007aff; color: white; text-decoration: none; border-radius: 10px; font-size: 18px;">تثبيت الآن</a></body></html>
          EOF

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Send Telegram Message
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ github.event.inputs.chat_id }}
        run: |
          INSTALL_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/install_${CHAT_ID}/index.html"
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\": \"${CHAT_ID}\", \"text\": \"✅ اكتمل التوقيع بنجاح!\n\n🌐 رابط التثبيت المباشر (OTA):\n${INSTALL_URL}\", \"disable_web_page_preview\": true}"
